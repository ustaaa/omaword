name: OmaWord checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CRAFT_FONTS_DIR: ${{ github.workspace }}/.build-inputs/fonts
      CRAFT_FONTS_REQUIRED: 1
      CRAFT_I18N_DIR: ${{ github.workspace }}/.build-inputs/i18n
      CRAFT_I18N_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: .build-inputs/fonts
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: 9205108cfdced5177706264038848b68b2422d2b
          path: .build-inputs/i18n
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - run: rustup update stable && rustup component add clippy rustfmt && rustup target add wasm32-unknown-unknown
      - run: cargo xtask ci
